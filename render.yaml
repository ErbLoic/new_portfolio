# Blueprint Render : https://render.com/docs/blueprint-spec
# Les valeurs « sync: false » sont demandées par Render à la création
# (elles ne sont jamais écrites dans ce fichier ni dans le dépôt).
services:
  - type: web
    name: portfolio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/ping
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_SECRET
        generateValue: true
      - key: TRUSTED_PROXIES
        value: REMOTE_ADDR
      - key: DATABASE_URL
        sync: false
      - key: MAILER_DSN
        sync: false
      - key: MAILER_FROM
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET
        sync: false
      - key: CLOUDFLARE_R2_ENDPOINT
        sync: false
      - key: CLOUDFLARE_R2_PUBLIC_URL
        sync: false
      - key: SITE_HOST_INFO
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: BING_SITE_VERIFICATION
        sync: false
