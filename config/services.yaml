# Configuration des services : https://symfony.com/doc/current/service_container.html
parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            # Données de test : le bundle de fixtures n'est installé qu'en développement
            - '../src/DataFixtures/'
            - '../src/Kernel.php'

when@dev:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
        App\DataFixtures\:
            resource: '../src/DataFixtures/'

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
        App\DataFixtures\:
            resource: '../src/DataFixtures/'
